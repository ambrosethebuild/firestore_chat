name: firestore_chat
description: Chat using firestore. A very simple complete Chat System for
  flutter with firestore as backend for chat data. Fully functional package for
  Cloud Firestore that makes easier to implement chat in your application
version: 0.2.1
homepage: "https://github.com/ambrosethebuild/firestore_chat"

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  cloud_firestore: ^6.7.1
  dash_chat_custom: ^0.0.33
  firebase_core: ^4.12.1
  firebase_storage: ^13.4.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.3
  intl: ^0.20.2
  ionicons: ^0.2.2
  stacked: ^3.5.0
  url_launcher: ^6.3.2

dependency_overrides:
  # dash_chat_custom pins intl ^0.19.0, but flutter_localizations (SDK)
  # pins intl to exactly 0.20.2. Override to satisfy the SDK constraint.
  intl: ^0.20.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter: null
